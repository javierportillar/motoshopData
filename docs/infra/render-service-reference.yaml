# REFERENCIA — NO configura nada.
#
# El servicio `motoshop-cloud-api` se creó a mano en el dashboard y NO está
# gestionado por un blueprint (Render: `blueprintId: None`, `blueprints: []`).
# Render IGNORA este archivo: los cambios acá no tienen efecto.
#
# La configuración real vive en el dashboard y se aplicó por API:
#   DUCKDB_MEMORY_LIMIT=128MB · DUCKDB_THREADS=1
#   DUCKDB_R2_AUTO_REFRESH=1 · DUCKDB_R2_REFRESH_TTL=1800
#   R2_METRICS_ARTIFACT=1
#   startCommand: uvicorn motoshop_api.main:app --host 0.0.0.0 --port $PORT --limit-max-requests 1000
#
# Se conserva como inventario de variables por si hay que recrear el servicio.
# Si algún día se adopta blueprint, este archivo vuelve a `motoshop-app/api/render.yaml`.

services:
  - type: web
    name: motoshop-cloud-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e .
    # --limit-max-requests recicla el worker cada 1000 requests: si algo retiene
    # memoria, el pico no se acumula hasta el OOM (render reinició por
    # "exceeded its memory limit" el 2026-11-03, plan free = 512 MB).
    startCommand: uvicorn motoshop_api.main:app --host 0.0.0.0 --port $PORT --limit-max-requests 1000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_HTTP_PATH
        value: /sql/1.0/warehouses/43bc044eaef4cca4
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://app.fragloesja.uk,https://motoshop-web-tau.vercel.app
      - key: ENV
        value: prod
      - key: USERS_FILE_PATH
        value: users.yaml
      - key: DATA_BACKEND
        value: duckdb
      # DuckDB se come la RAM que le dejen: en 512 MB hay que ponerle techo y
      # bajar los hilos, o una consulta grande tumba el proceso.
      - key: DUCKDB_MEMORY_LIMIT
        value: 128MB
      - key: DUCKDB_THREADS
        value: "1"
      # El gold NO se re-descarga cuando el pipeline sube un snapshot nuevo: el
      # disco es efimero y cada refresco son ~50 MB de salida + el doble de
      # memoria en el swap. Render es respaldo: sirve el snapshot del arranque.
      - key: DUCKDB_R2_AUTO_REFRESH
        value: "0"
      # DUCKDB_PATH removido (2026-06-15): el override fijo a motoshop_gold.duckdb
      # rompia el multi-tenant — con la env var seteada, _make_db_path() ignoraba
      # el tenant y siempre devolvia el path de MotoShop, asi masvital terminaba
      # leyendo el DuckDB equivocado. Sin esta var y con ENV=prod, el codigo usa
      # el default /tmp/{tenant}_gold.duckdb que es lo correcto post-M1.7.
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: motoshop-gold
      - key: R2_ENDPOINT
        value: https://4bd1502b7fa3f33d1d3c45ae2d252cfd.r2.cloudflarestorage.com
      # Recovery: skip Supabase user override so YAML credentials work.
      # Remove after resetting the admin password via Supabase dashboard.
      - key: SUPABASE_USERS_OVERRIDE
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID_MOTOSHOP
        sync: false
      - key: TELEGRAM_CHAT_ID_MASVITAL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AGENT_CONVERSATION_BACKEND
        value: supabase
      - key: OPENCODE_API_KEY
        sync: false
      - key: GO_MODEL
        value: deepseek-v4-flash
      - key: OPENCODE_API_KEY_FALLBACK
        sync: false
      - key: EMBEDDING_API_BASE
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ZEN_API_BASE
        value: https://router.huggingface.co/v1
      - key: ZEN_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
      - key: ZEN_MAX_TOKENS
        value: "8000"
