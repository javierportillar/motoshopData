tenants:
  - id: motoshop
    nombre: "MotoShop"
    descripcion: "Repuestos de moto · Cali, Colombia"
    color_brand: "#7B1818"
    logo: "/tenants/motoshop/logo.png"
    r2_object_key: "motoshop_gold.duckdb"
    local_db_path: "/tmp/motoshop_gold.duckdb"
    mysql_source: "sgHermes"
    telegram_chat_id_gerente: null  # delivery uses TELEGRAM_CHAT_ID_MOTOSHOP
    enabled_features:
      - products
      - stock
      - sales
      - ventas-summary
      - ventas-daily
      - ventas-monthly
      - inventario
      - decisiones
      - analisis
      - abc
      - dormidos
      - cohortes
      - drift
      - forecast
      - plan-compras
      - vendedores
      - alerts
      - acciones
      - chat-ia
      - briefing-diario
      - pipeline-observability
      - data-catalog
    briefing:
      activo: true
      hora_cron_utc: "0 11 * * *"
    agent:
      display_name: "Asistente MotoShop"
      business_description: "Repuestos y accesorios para moto en Cali, Colombia. Asistente transversal que cubre ventas, inventario, compras a proveedores y reportes del negocio."
      locale: "es-CO"
      currency: "COP"
      enabled_tools: [get_kpis_today, get_kpis_month, get_top_skus, get_dormidos, get_alerts_by_urgency, get_vendedor_performance, get_inventory_value, compare_periods, get_abc_distribution, get_forecast_summary, get_data_freshness, search_business_knowledge, get_ultima_compra, get_compras_recientes, buscar_compras_por_proveedor, get_producto_detalle, search_products, get_productos_comportamiento, get_top_clientes, get_inventario_por_bodega, get_abc_xyz_distribution, get_cohortes_clientes, get_drift_alerts, generate_report]
      knowledge_namespace: "motoshop"

  - id: masvital
    nombre: "MasVital"
    descripcion: "Nuevo negocio"
    color_brand: "#16A34A"
    logo: "/tenants/masvital/logo.png"
    r2_object_key: "masvital_gold.duckdb"
    local_db_path: "/tmp/masvital_gold.duckdb"
    mysql_source: "masvital_pos"
    telegram_chat_id_gerente: null  # delivery uses TELEGRAM_CHAT_ID_MASVITAL
    enabled_features:
      - products
      - stock
      - sales
      - ventas-summary
      - ventas-daily
      - inventario
      - decisiones
      - analisis
      - chat-ia
      - briefing-diario
      - pipeline-observability
      - expiry-lots
    briefing:
      activo: true
      hora_cron_utc: "0 11 * * *"
    agent:
      display_name: "Asistente MasVital"
      business_description: "Operación comercial, control de inventario y compras a proveedores de MasVital"
      locale: "es-CO"
      currency: "COP"
      enabled_tools: [get_kpis_today, get_kpis_month, get_top_skus, get_dormidos, get_inventory_value, get_data_freshness, search_business_knowledge, get_ultima_compra, get_compras_recientes, buscar_compras_por_proveedor, get_producto_detalle, search_products, get_top_clientes, get_inventario_por_bodega, get_drift_alerts, generate_report]
      knowledge_namespace: "masvital"
